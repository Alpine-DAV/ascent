name: build_ascent_gcc

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  build_basic:
    name: Ubuntu Build Ascent GCC with pyvenv
    runs-on: ubuntu-22.04
    env:
      CC: gcc
      CXX: g++
      FC: gfortran
      CMAKE_VERSION: 3.31.8
    steps:
    - name: Install System Deps
      run: |
           sudo apt-get update
           sudo apt-get -y install binutils \
                                   gcc \
                                   g++ \
                                   gfortran \
                                   python3 \
                                   python3-dev \
                                   python3-venv \
                                   perl \
                                   git \
                                   git-lfs \
                                   curl \
                                   wget \
                                   tar \
                                   unzip \
                                   build-essential \
                                   libncurses-dev \
                                   libssl-dev \
                                   libblas-dev \
                                   liblapack-dev \
                                   zlib1g-dev \
                                   libgdbm-dev \
                                   libreadline-dev \
                                   libsqlite3-dev \
                                   libbz2-dev \
                                   openmpi-bin \
                                   openmpi-common \
                                   libopenmpi-dev \
                                   cmake
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        submodules: 'recursive'
    - name: Install CMake
      run: |
        curl -L https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz -o cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
        tar -xzf cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
        cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake --version
    - name: Env Info
      run: |
        export CWD=`pwd`
        export PATH=${CWD}/cmake-${CMAKE_VERSION}-linux-x86_64/bin/:$PATH
        echo "**** Env Info"
        echo $PATH
        cmake --version
        gcc --version
        which mpicc
    - name: Build TPLs
      run: |
        export CWD=`pwd`
        export PATH=${CWD}/cmake-${CMAKE_VERSION}-linux-x86_64/bin/:$PATH
        env enable_mpi=ON \
            enable_fortran=ON \
            enable_tests=OFF \
            enable_verbose=OFF \
            build_caliper=true \
            enable_python=ON \
            build_pyvenv=true \
            build_ascent=false \
            build_jobs=2 \
            ./scripts/build_ascent/build_ascent.sh
    - name: Configure Ascent
      run: |
        export CWD=`pwd`
        export PATH=${CWD}/cmake-${CMAKE_VERSION}-linux-x86_64/bin/:$PATH
        echo "**** Configuring Ascent"
        cmake -S src -B build -C ascent-config.cmake -DCMAKE_INSTALL_PREFIX=install
    - name: Build Ascent
      run: |
        export CWD=`pwd`
        export PATH=${CWD}/cmake-${CMAKE_VERSION}-linux-x86_64/bin/:$PATH
        echo "**** Building Ascent"
        cmake --build build -j2
    - name: Install Ascent
      run: |
        export CWD=`pwd`
        export PATH=${CWD}/cmake-${CMAKE_VERSION}-linux-x86_64/bin/:$PATH
        echo "**** Installing Ascent"
        cmake --install build
    - name: Check Install
      run: |
        export CWD=`pwd`
        export PATH=${CWD}/cmake-${CMAKE_VERSION}-linux-x86_64/bin/:$PATH
        echo "**** Checking Ascent using-with-cmake-mpi example"
        export CC=/usr/bin/mpicc
        export CXX=/usr/bin/mpicxx
        cd install/examples/ascent/using-with-cmake-mpi
        cmake -S . -B build
        cmake --build build --verbose -j2
        export VISKORES_INSTALL_DIR=`ls -d /home/runner/work/ascent/ascent/install/viskores-*`
        export LD_LIBRARY_PATH=${VISKORES_INSTALL_DIR}/lib/:${LD_LIBRARY_PATH}
        mpiexec -n 2 ./build/ascent_mpi_render_example
