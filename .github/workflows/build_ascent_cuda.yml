name: build_ascent_cuda

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  build_cuda:
    name: Build Ascent CUDA
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - name: cuda 12.8.1-shared
            container: alpinedav/ascent-devel:ubuntu-22.04-cuda-12.8.1-x86_64
            env:
              cc: gcc
              cxx: g++
              cmake_version: 3.31.8
              build_shared_libs: ON
              cmake_build_type: Release
              cuda_arch: 80
              enable_dray: OFF
              enable_mfem: ON
              blt_cxx_std: c++17
              enable_tests: ON
              enable_examples: ON
              enable_utils: ON
          - name: cuda 12.8.1-static
            container: alpinedav/ascent-devel:ubuntu-22.04-cuda-12.8.1-x86_64
            env:
              cc: gcc
              cxx: g++
              cmake_version: 3.31.8
              build_shared_libs: OFF
              cmake_build_type: Release
              cuda_arch: 80
              enable_dray: OFF
              enable_mfem: ON
              blt_cxx_std: c++17
              # static linking unit tests + examples eats up alot of disk space,
              # so skip building tests in CI to keep us away from clif
              enable_tests: OFF
              enable_examples: OFF
              enable_utils: OFF
          - name: cuda 11.8.0-shared
            container: alpinedav/ascent-devel:ubuntu-22.04-cuda-11.8.0-x86_64
            env:
              cc: gcc
              cxx: g++
              cmake_version: 3.31.8
              build_shared_libs: ON
              cmake_build_type: Release
              cuda_arch: 70
              enable_dray: OFF
              enable_mfem: ON
              blt_cxx_std: c++17
              enable_tests: ON
              enable_examples: ON
              enable_utils: ON
    env:
      COMPILER_CC: ${{ matrix.env.cc }}
      COMPILER_CXX: ${{ matrix.env.cxx }}
      CMAKE_VERSION:  ${{ matrix.env.cmake_version }}
      BUILD_SHARED_LIBS: ${{ matrix.env.build_shared_libs }}
      CMAKE_BUILD_TYPE: ${{ matrix.env.cmake_build_type }}
      CUDA_ARCH: ${{ matrix.env.cuda_arch }}
      ENABLE_DRAY: ${{ matrix.env.enable_dray }}
      ENABLE_MFEM: ${{ matrix.env.enable_mfem }}
      BLT_CXX_STD: ${{ matrix.env.blt_cxx_std }}
      ENABLE_TESTS: ${{ matrix.env.enable_tests }}
      ENABLE_EXAMPLES: ${{ matrix.env.enable_examples }}
      ENABLE_UTILS: ${{ matrix.env.enable_utils }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        submodules: 'recursive'
    - name: Install CMake
      run: |
        curl -L https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz -o cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
        tar -xzf cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz
        cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake --version
    - name: Build TPLs
      run: |
        export PATH=$PATH:cmake-${CMAKE_VERSION}-linux-x86_64/bin/
        cmake --version
        export CC=${COMPILER_CC}
        export CXX=${COMPILER_CXX}
        export FC=${COMPILER_FC}
        ${CC} --version
        env enable_cuda=ON \
            enable_mpi=ON \
            enable_fortran=OFF \
            enable_tests=OFF \
            build_ascent=OFF \
            enable_verbose=OFF \
            build_shared_libs=${BUILD_SHARED_LIBS} \
            build_config=${CMAKE_BUILD_TYPE} \
            build_jobs=3 \
            CFLAGS=-fno-lto \
            CXXFLAGS=-fno-lto \
            LDFLAGS=-fno-lto \
            ./scripts/build_ascent/build_ascent.sh
    - name: Configure Ascent
      run: |
        export PATH=$PATH:cmake-${CMAKE_VERSION}-linux-x86_64/bin/
        cmake --version
        echo "**** Configuring Ascent"
        export CFLAGS="-fno-lto"
        export CXXFLAGS="-fno-lto"
        export LDFLAGS="-fno-lto"
        export CMAKE_OPTS="-S src -B build -C ascent-config.cmake -DCMAKE_INSTALL_PREFIX=ascent_install"
        export CMAKE_OPTS="${CMAKE_OPTS} -DCMAKE_CXX_FLAGS=-fno-lto -DCMAKE_CUDA_ARCHITECTURES=${CUDA_ARCH}"
        echo "cmake ${CMAKE_OPTS}"
        cmake ${CMAKE_OPTS}
    - name: Build Ascent
      run: |
        export PATH=$PATH:cmake-${CMAKE_VERSION}-linux-x86_64/bin/
        echo "**** Building Ascent"
        cmake --build  build -j3 --config ${CMAKE_BUILD_TYPE}
    - name: Install Ascent
      run: |
        export PATH=$PATH:cmake-${CMAKE_VERSION}-linux-x86_64/bin/
        echo "**** Installing Ascent"
        cmake --install  build --config ${CMAKE_BUILD_TYPE}
    - name: "Test vs Install (using-with-cmake) [build only]"
      run: |
          export PATH=$PATH:cmake-${CMAKE_VERSION}-linux-x86_64/bin/
          export LD_LIBRARY_PATH="/usr/local/cuda/compat/"
          env CC=mpicc CXX=mpic++ cmake \
              -DCMAKE_CXX_FLAGS="-fno-lto" \
              -DCMAKE_CUDA_ARCHITECTURES=${CUDA_ARCH} \
              -S ascent_install/examples/ascent/using-with-cmake -B _test_using_with_cmake
          cd _test_using_with_cmake
          make VERBOSE=1
    - name: "Test vs Install (using-with-make) [build only]"
      run: |
          echo "**** Building using with make example"
          cat ascent_install/share/ascent/ascent_config.mk
          export LD_LIBRARY_PATH="/usr/local/cuda/compat/"
          cd ascent_install/examples/ascent/using-with-make
          env CC=mpicc CXX=mpic++ CXXFLAGS="-fno-lto" make

