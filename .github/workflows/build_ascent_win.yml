name: build_ascent_windows

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  build_windows_msvc_base:
    name: MSVC Base Release
    runs-on: windows-2025
    steps:
    - name: Setup MPI
      uses: mpi4py/setup-mpi@dbbb80b116bea57fc1788daf7dbbf7ab3df3a0f1 # v1
    - name: Setup Python Env
      run: python3 -m pip install --upgrade pip numpy mpi4py wheel
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      with: 
        submodules: 'recursive'
    - name: Setup CMake
      run: |
          CMAKE_VERSION="3.31.12"
          INSTALLER="cmake-${CMAKE_VERSION}-windows-x86_64.msi"
          URL="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${INSTALLER}"
          DOWNLOAD_DIR="${TEMP:-/tmp}/cmake_install"
          INSTALLER_PATH="${DOWNLOAD_DIR}/${INSTALLER}"
          curl -L --fail -o "${INSTALLER}" "${URL}"
          cmd.exe /c msiexec /i "$(cygpath -w "${INSTALLER_PATH}")" /qn ADD_CMAKE_TO_PATH=System
          which cmake
          cmake --version
      shell: bash
    - name: Build TPLs
      run: |
        env build_ascent=false `
            enable_tests=OFF `
            ./scripts/build_ascent/build_ascent.sh
    - name: Configure Ascent
      run: |
        echo "**** Configuring Ascent"
        cmake -S src -B build `
              -C ascent-config.cmake `
              -DENABLE_TESTS=ON `
              -DCMAKE_INSTALL_PREFIX=install
    - name: Build Ascent
      run: |
        echo "**** Building Ascent"
        cmake --build  build --config Release -j2
    - name: Install Ascent
      run: |
        echo "**** Installing Ascent"
        cmake --install  build --config Release
    - name: Run Ascent Unit Tests
      run: |
        echo "**** Ascent Unit Tests"
        cmake -E env CTEST_OUTPUT_ON_FAILURE=1 cmake --build build --config Release --target RUN_TESTS
    - name: Upload Ascent Unit Test Artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results
        path: build/tests/_output/
        retention-days: 7
