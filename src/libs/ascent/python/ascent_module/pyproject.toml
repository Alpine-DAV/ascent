[build-system]
# Conduit builds its python modules with `pip install --no-build-isolation`,
# which means that pip will not install required packages/versions. Instead,
# they must already be present in the Python used to build Conduit.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascent"
version = "0.9.6"
description = "ascent"
requires-python = ">=3.8"

[tool.setuptools.package-dir]
ascent = "py_src"

[tool.setuptools]
zip-safe = false
packages = [
    "ascent",
    "ascent.bridge_kernel",
    "ascent.mpi"
]

