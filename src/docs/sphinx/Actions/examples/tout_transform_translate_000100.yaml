#An example transform filter using translation.

- 
  action: "add_pipelines"
  pipelines: 
    pl1: 
      f1: 
        type: "transform"
        params: 
          translate: 
            x: 23.0
            y: 15.0
- 
  action: "add_scenes"
  scenes: 
    s1: 
      plots: 
        p1: 
          type: "pseudocolor"
          field: "braid"
          pipeline: "pl1"
        p2: 
          type: "pseudocolor"
          field: "radial"
      image_prefix: "/home/user/sandbox/ascent/scripts/build_ascent/build/ascent-checkout/tests/_output/tout_transform_translate"
