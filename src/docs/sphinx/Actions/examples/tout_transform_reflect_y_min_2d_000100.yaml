#An example transform filter using reflect a 2D slice across y's minimum.

- 
  action: "add_pipelines"
  pipelines: 
    pl0: 
      f1: 
        type: "transform"
        params: 
          translate: 
            x: 10.0
            y: 10.0
    pl1: 
      f1: 
        type: "slice"
        params: 
          point: 
            x: 0.0
            y: 0.0
            z: 0.0
          normal: 
            x: 0.0
            y: 0.0
            z: 1.0
    pl2: 
      f1: 
        type: "transform"
        params: 
          reflect: 
            normal: 
              y: 1
            point: 
              y: "min"
      pipeline: "pl1"
- 
  action: "add_scenes"
  scenes: 
    s1: 
      plots: 
        p1: 
          type: "pseudocolor"
          field: "braid"
          pipeline: "pl2"
        p2: 
          type: "pseudocolor"
          field: "braid"
          pipeline: "pl1"
      image_prefix: "/home/user/sandbox/ascent/scripts/build_ascent/build/ascent-checkout/tests/_output/tout_transform_reflect_y_min_2d"
