#An example transform filter rotating around the z-axis.

- 
  action: "add_pipelines"
  pipelines: 
    pl1: 
      f1: 
        type: "transform"
        params: 
          rotate: 
            angle: 45.0
            axis: 
              z: 1.0
      f2: 
        type: "transform"
        params: 
          translate: 
            y: 50.0
- 
  action: "add_scenes"
  scenes: 
    s1: 
      plots: 
        p1: 
          type: "pseudocolor"
          field: "braid"
          pipeline: "pl1"
        p2: 
          type: "pseudocolor"
          field: "radial"
      image_prefix: "/home/user/sandbox/ascent/scripts/build_ascent/build/ascent-checkout/tests/_output/tout_transform_rotate_z"
