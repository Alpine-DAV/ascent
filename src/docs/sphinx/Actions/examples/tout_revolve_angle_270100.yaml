#An example of the revolve filter with a partial revolution (270 degrees).

- 
  action: "add_pipelines"
  pipelines: 
    pl1: 
      f1: 
        type: "slice"
        params: 
          point: 
            x: 0.0
            y: 0.0
            z: 0.0
          normal: 
            x: 0.0
            y: 0.0
            z: 1.0
      f2: 
        type: "contour"
        params: 
          field: "braid"
          iso_values: 0.0
      f3: 
        type: "revolve"
        params: 
          axis: 
            x: 0.0
            y: 1.0
            z: 0.0
          point: 
            x: 0.0
            y: 0.0
            z: 0.0
          start_angle: 0.0
          angle: 270.0
          steps: 8
          periodic: "false"
- 
  action: "add_scenes"
  scenes: 
    s1: 
      plots: 
        p1: 
          type: "mesh"
          pipeline: "pl1"
      image_prefix: "/path/to/output/tout_revolve_angle_270"
