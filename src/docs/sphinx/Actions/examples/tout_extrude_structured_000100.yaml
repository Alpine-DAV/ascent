#An example of linearly extruding a dataset 8 steps along a vector.

- 
  action: "add_pipelines"
  pipelines: 
    pl1: 
      f1: 
        type: "extrude"
        params: 
          vector: 
            r: 0.0
            z: 5.0
          steps: 8
- 
  action: "add_extracts"
  extracts: 
    e1: 
      type: "relay"
      pipeline: "pl1"
      params: 
        path: "ascent/scripts/build_ascent/build/ascent-checkout/tests/_output/tout_extrude_structured_hdf5"
        protocol: "blueprint/mesh/hdf5"
- 
  action: "add_scenes"
  scenes: 
    s1: 
      plots: 
        p1: 
          type: "pseudocolor"
          field: "cyl"
          pipeline: "pl1"
      renders: 
        r1: 
          image_prefix: "ascent/scripts/build_ascent/build/ascent-checkout/tests/_output/tout_extrude_structured"
